name: Compile and Deploy CV

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check line length (max 120)
        run: make check

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv-human.tex
            cv-ats.tex
          compiler: pdflatex

      - name: Prepare Pages Artifact
        run: |
          mkdir -p public
          # Moves the compiled PDFs into the deployment directory
          mv cv-human.pdf public/cv-human.pdf
          mv cv-ats.pdf public/cv-ats.pdf
          # cv.pdf is the main alias, a copy of the ATS version
          cp public/cv-ats.pdf public/cv.pdf
          # Optional: Create an index.html so visitors see something if they type your root Pages URL
          echo '<meta http-equiv="refresh" content="0; URL=./cv.pdf">' > public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
